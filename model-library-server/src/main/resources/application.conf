model.library.server {
  port = 8090
}

model.library.runtime {
  executor = "stub"
}

model.library.defaults {
  simulation {
    simulationId = "sim-001"
    modelInstanceId = "instance-001"
    coordinatorId = "demo-coordinator"
  }
  kafka {
    bootstrapServers = "localhost:9092"
    topic = "simulation-events"
    consumerGroup = "simulation-runner"
    securityProtocol = "PLAINTEXT"
    saslMechanism = ""
  }
}