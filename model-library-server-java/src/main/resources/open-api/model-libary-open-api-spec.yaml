openapi: 3.1.0

info:
  title: DEVS Model API
  version: 1.0.0

paths:

  /v1/models:
    get:
      summary: List available models
      operationId: listModels
      responses:
        '200':
          description: Available models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'

  /v1/models/{modelId}:
    get:
      summary: Get model definition
      operationId: getModel
      parameters:
        - $ref: '#/components/parameters/ModelId'
      responses:
        '200':
          description: Model definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/models/{modelId}/run:
    put:
      summary: Start a model run
      operationId: startModelRun
      parameters:
        - $ref: '#/components/parameters/ModelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartModelRunRequest'
      responses:
        '202':
          description: Run request accepted and queued for execution startup
          headers:
            Location:
              description: URL for polling run status
              schema:
                type: string
                example: /v1/runs/run-001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartModelRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/runs:
    get:
      summary: List all runs
      operationId: listRuns
      responses:
        '200':
          description: List of run statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunStatusResponse'

  /v1/runs/{runId}:
    get:
      summary: Get run status
      operationId: getRunStatus
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Cancel run
      operationId: deleteRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run status after cancel request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/run-config/defaults:
    get:
      summary: Get default run configuration values
      operationId: getRunConfigDefaults
      responses:
        '200':
          description: Default Kafka values for run configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KafkaDefaultsResponse'

components:

  parameters:
    ModelId:
      name: modelId
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string

  schemas:

    ModelListResponse:
      type: object
      required:
        - models
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelSummary'

    ModelSummary:
      type: object
      required:
        - modelId
        - name
        - description
        - implementationLanguage
      properties:
        modelId:
          type: string
          example: battery-model-v1
        name:
          type: string
          example: Battery Energy Model
        description:
          type: string
        timeMode:
          $ref: '#/components/schemas/TimeMode'
        implementationLanguage:
          type: string
          example: Java

    Model:
      type: object
      required:
        - modelId
        - name
        - description
        - inputPorts
        - outputPorts
        - parameters
        - implementationLanguage
        - messageSchemas
        - initializationSchema
      properties:
        modelId:
          type: string
        name:
          type: string
        description:
          type: string
        implementationLanguage:
          type: string
          example: Java

        inputPorts:
          type: array
          items:
            $ref: '#/components/schemas/PortDefinition'

        outputPorts:
          type: array
          items:
            $ref: '#/components/schemas/PortDefinition'

        parameters:
          type: array
          description: High-level list of model initialization parameters.
          items:
            $ref: '#/components/schemas/ParameterDefinition'

        messageSchemas:
          type: object
          description: JSON Schemas for port message payloads.
          additionalProperties:
            $ref: '#/components/schemas/JsonSchema'

        initializationSchema:
          $ref: '#/components/schemas/JsonSchema'

        defaultParameterSet:
          $ref: '#/components/schemas/ModelDefaultParameterSet'

        behaviorDescription:
          type: string
          description: Optional code, pseudo-code, or behavioral explanation.

        metadata:
          type: object
          additionalProperties: true

    PortDefinition:
      type: object
      required:
        - name
        - direction
        - messageType
      properties:
        name:
          type: string
          example: powerDemand
        direction:
          type: string
          enum: [input, output]
        messageType:
          type: string
          example: BatteryPowerRequest
        description:
          type: string

    ParameterDefinition:
      type: object
      required:
        - name
        - type
        - required
      properties:
        name:
          type: string
          example: initialStateOfCharge
        type:
          type: string
          example: number
        required:
          type: boolean
        defaultValue: {}
        description:
          type: string

    StartModelRunRequest:
      type: object
      required:
        - initializationParameters
        - kafka
      properties:
        runId:
          type: string
          description: Optional caller-provided run identifier.
          example: run-001

        initializationParameters:
          type: object
          description: |
            Model-specific initialization values. This object must validate
            against the model's initializationSchema.
          additionalProperties: true

        kafka:
          $ref: '#/components/schemas/KafkaConfiguration'

        simulation:
          $ref: '#/components/schemas/SimulationContext'

    KafkaConfiguration:
      type: object
      description: |
        Kafka runtime settings for receiving simulation output from a shared topic.
        The consumer group ID is not caller-configurable; at runtime it is always
        derived as `runId:receiverId`, giving each receiver stable run-scoped offset
        tracking. Callers must not set `group.id` in Kafka client configuration.
      required:
        - bootstrapServers
        - topic
      properties:
        bootstrapServers:
          type: string
          example: kafka.example.com:9092
        topic:
          type: string
          description: |
            Shared Kafka topic reused across runs. Per-run isolation is achieved via
            runId-based record keying and `X-Run-Id` header filtering, not by creating
            dedicated per-run topics.
          example: simulation.run.001
        securityProtocol:
          type: string
          example: SASL_SSL
        saslMechanism:
          type: string
          example: SCRAM-SHA-512
        properties:
          type: object
          additionalProperties:
            type: string

    SimulationContext:
      type: object
      properties:
        simulationId:
          type: string
          example: sim-001
        modelInstanceId:
          type: string
          example: instance-001
        coordinatorId:
          type: string
          example: mission-coordinator-alpha
        timeMode:
          $ref: '#/components/schemas/TimeMode'

    TimeModeType:
      type: string
      description: Runtime pacing strategy independent of common logical time.
      enum: [real-time, scaled-real-time, virtual-time]

    TimeMode:
      type: object
      description: Optional runtime pacing configuration. Logical time uses the common unit-one JSON-number representation.
      required:
        - mode
      properties:
        mode:
          $ref: '#/components/schemas/TimeModeType'
          description: Runtime pacing mode independent from logical time representation.
        realTimeFactor:
          type: number
          format: double
          description: Scaling factor for `scaled-real-time` mode (for example, `2.0` runs at 2x wall-clock speed).
          example: 2.0
      allOf:
        - if:
            properties:
              mode:
                const: scaled-real-time
          then:
            required: [realTimeFactor]

    StartModelRunResponse:
      type: object
      required:
        - runId
        - modelId
        - status
        - statusUrl
      properties:
        runId:
          type: string
          description: Server-assigned run identifier for status polling.
          example: run-7f83a9c2
        modelId:
          type: string
          example: irpsystem.irpmodel.Vehicle
        status:
          $ref: '#/components/schemas/RunStatus'
        statusUrl:
          type: string
          description: Relative URL to retrieve current run status.
          example: /v1/runs/run-7f83a9c2
        acceptedAt:
          type: string
          format: date-time
          description: Timestamp when the server accepted the run request.
          example: '2026-06-14T12:00:00Z'
        message:
          type: string

    RunStatusResponse:
      type: object
      required:
        - runId
        - modelId
        - status
      properties:
        runId:
          type: string
          example: run-7f83a9c2
        modelId:
          type: string
          example: irpsystem.irpmodel.Vehicle
        status:
          $ref: '#/components/schemas/RunStatus'
        acceptedAt:
          type: string
          format: date-time
          example: '2026-06-14T12:00:00Z'
        readyAt:
          type: string
          format: date-time
          description: Set when runtime signals readiness for execution.
          example: '2026-06-14T12:00:05Z'
        startedAt:
          type: string
          format: date-time
          example: '2026-06-14T12:00:06Z'
        completedAt:
          type: string
          format: date-time
          example: '2026-06-14T12:03:20Z'
        message:
          type: string
        currentSimulationTime:
          $ref: '#/components/schemas/CurrentSimulationTime'

    KafkaDefaultsResponse:
      type: object
      description: |
        Default Kafka connection values for run startup.
        Consumer group ID is not included because it is derived at runtime as
        `runId:receiverId` and is not caller-configurable.
      required:
        - bootstrapServers
        - topic
        - securityProtocol
        - saslMechanism
      properties:
        bootstrapServers:
          type: string
          example: localhost:9092
        topic:
          type: string
          example: devs-sim
        securityProtocol:
          type: string
          example: PLAINTEXT
        saslMechanism:
          type: string
          example: ''

    CurrentSimulationTime:
      type: object
      required:
        - value
        - sourceMessageType
        - updatedAt
      properties:
        value:
          type: number
          description: Common logical time as a JSON number. Participants agree on Integer or Real representation and a unit length of one.
          example: 125.0
        sourceMessageType:
          type: string
          example: NextInternalTimeReport
        sourceMessageId:
          type: string
          example: message-123
        updatedAt:
          type: string
          format: date-time
          example: '2026-07-01T12:34:56Z'

    RunStatus:
      type: string
      description: Lifecycle state for a submitted run.
      enum: [accepted, starting, ready, running, completed, failed, canceled]

    JsonSchema:
      type: object
      description: Embedded JSON Schema 2020-12 document.
      additionalProperties: true

    ModelDefaultParameterSet:
      type: object
      description: |
        Model-specific initialization default values.
        This object must validate against the model's initializationSchema.
      additionalProperties: true

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
