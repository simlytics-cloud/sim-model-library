model.library {
  server.port = 8090
  catalog.resources = ["classpath:data/model-catalog.json"]
  # "stub" is the default. "example-clerk" is an isolated non-production in-process example.
  runtime.executor = "stub"
  run-config.kafka-defaults {
    bootstrap-servers = "localhost:9092"
    topic = "devs-sim"
    security-protocol = "PLAINTEXT"
    sasl-mechanism = ""
  }
}